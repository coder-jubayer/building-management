name: building-management

services:
  mongo:
    image: mongo:7.0
    container_name: bm-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-bmadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-building_prod}
    volumes:
      - bm_mongo_data:/data/db
    networks:
      - bm_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: building-management-api:latest
    container_name: bm-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-bmadmin}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-building_prod}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      API_URL: ${API_URL:-http://64.176.81.197:3011}
      SEED_DEMO: ${SEED_DEMO:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${API_HOST_PORT:-3011}:3001"
    volumes:
      - bm_uploads:/app/uploads
    networks:
      - bm_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

networks:
  bm_internal:
    name: building-management_internal
    driver: bridge

volumes:
  bm_mongo_data:
    name: building-management_mongo_data
  bm_uploads:
    name: building-management_uploads
